name: Feature request
description: Suggest a focused improvement to DebtShark.
title: "Idea: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the user need, not just the proposed interface.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your idea
      description: What would make the experience better?
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Project principles
      options:
        - label: This idea can work without accounts, tracking, or remote storage.
          required: true
        - label: I have not included personal or financial information.
          required: true
