name: Bug report
description: Tell us about a reproducible problem in DebtShark.
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please use invented example values only. Do not include real account numbers, financial details, notices, addresses, or screenshots containing personal information.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Enter test values ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g., Safari on iPhone or Chrome on Windows
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
